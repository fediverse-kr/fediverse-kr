[package]
name = "fediversekr2"
version = "0.1.0"
authors = ["Fediverse.kr contributors"]
edition = "2021"
default-run = "fediversekr2"
# This website application is deployed as a binary/image, not published to crates.io.
# Source is dual-licensed under conventional Rust terms; publication remains disabled.
license = "MIT OR Apache-2.0"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "=0.7.9", features = ["router", "fullstack"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-free-icons = { version = "=0.10.0", default-features = false, features = ["hero-icons-solid", "ionicons", "bootstrap"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false }
lucide-dioxus = { version = "3.26.0", features = ["arrows", "charts", "communication", "connectivity", "development", "layout", "navigation", "social", "notifications", "multimedia"] }
unicode-segmentation = "=1.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "~2.3.9", default-features = false, features = ["postgres_backend", "uuid", "chrono", "32-column-tables"], optional = true }
diesel-async = { version = "=0.9.2", features = ["postgres", "bb8", "async-connection-wrapper"], optional = true }
diesel_migrations = { version = "=2.3.2", optional = true }
dioxus-cli-config = { version = "0.7.10", optional = true }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
sha2 = { version = "0.10", features = ["oid"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"], optional = true }
url = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
rsa = { version = "0.9", optional = true }
base64 = { version = "0.22", optional = true }
html5ever = { version = "0.35", optional = true }
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["system-config", "tokio"], optional = true }
opendal = { version = "=0.59.1", default-features = false, features = ["services-fs", "executors-tokio", "blocking"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"], optional = true }
subtle = { version = "=2.6.1", default-features = false, optional = true }
cookie = { version = "=0.18.2", default-features = false, optional = true }
percent-encoding = { version = "=2.3.2", optional = true }
quick-xml = { version = "=0.41.0", default-features = false, optional = true }
sanitize_html = { version = "=0.10.0", optional = true }
comrak = { version = "=0.54.0", default-features = false, optional = true }
html2text = { version = "=0.17.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
dioxus-history = "=0.7.10"

[features]
default = ["web"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web", "dep:url", "dep:base64"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop", "dep:url", "dep:base64"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile", "dep:url", "dep:base64"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = ["dioxus/server", "dep:diesel", "dep:diesel-async", "dep:diesel_migrations", "dep:dioxus-cli-config", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots", "dep:argon2", "dep:rand", "dep:sha2", "dep:uuid", "dep:chrono", "dep:tokio", "dep:url", "dep:reqwest", "dep:rsa", "dep:base64", "dep:html5ever", "dep:hickory-resolver", "dep:opendal", "dep:image", "dep:subtle", "dep:cookie", "dep:percent-encoding", "dep:quick-xml", "dep:sanitize_html", "dep:comrak", "dep:html2text"]
