[package]
name = "fedkr-federation"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Bounded, read-only ActivityPub account and public-post client"

[features]
default = []
publish = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
html5ever = "0.35"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rsa = "0.9"
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
url = "2"

[dev-dependencies]
rand = "0.8"

[[example]]
name = "social_post"
required-features = ["publish"]

[[example]]
name = "status_bot"
required-features = ["publish"]
