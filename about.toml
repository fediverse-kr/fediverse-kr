# This selects licenses for external dependencies, not a license for fediversekr2.
# Keep MIT first for ordinary OR choices; never discard an AND requirement.
accepted = [
    "MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "Apache-2.0", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "CDLA-Permissive-2.0",
    "BSL-1.0", "Unlicense", "0BSD", "MIT-0", "OpenSSL",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false
# The application's own source is MIT OR Apache-2.0; this file governs dependencies.
# Only unpublished workspace crates are skipped; external dependencies are not.
private = { ignore = true }
# Upstream's hash/version-aware handling for compound license files.
workarounds = ["ring", "chrono", "rustls"]
